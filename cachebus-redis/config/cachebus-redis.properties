# Redis/Valkey server the cache invalidation bus connects to; empty means the plugin does nothing.
# redis://host:6379, rediss://host:6380 for TLS, redis-sentinel://host:26379/0#mymaster for Sentinel.
cachebus.redis.uri=
# ACL user name; empty uses the server's default user.
cachebus.redis.username=
# Password: the first of these that is set is used.
# Name of an environment variable holding the password, e.g. REDIS_PASSWORD.
cachebus.redis.password-env=
# File holding the password (trailing line break ignored), e.g. /run/secrets/redis_password.
cachebus.redis.password-file=
# The password itself, or LOOKUP(key) to read it from the configured SecretProvider.
cachebus.redis.password=
# Cluster name: servers with the same name (and server) clear each other's caches. Name production on purpose.
cachebus.redis.cluster=test
