# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

# Each update runs the CI workflows on its pull request, again on each rebase
# after another pull request is merged, and once more when it is merged.
# To keep the number of jobs low, the updates are checked weekly and the minor
# and patch updates of each entry are grouped in a single pull request, while
# major updates, which need a closer review, still get their own pull request.

version: 2
updates:
  - package-ecosystem: "gradle"
    directories:
      - "/ai-agent-skills"
      - "/example"
      - "/firstdatapaymentgateway"
      - "/ldap"
      - "/lucene"
      - "/pricat"
      - "/secretshub"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Lucene 10 is compiled for Java 21, above our Java 17 baseline.
      - dependency-name: "org.apache.lucene:*"
        versions: [">= 10"]
      # cas-server-support-ldap-core 7.x needs Java 21 and 8.x needs Java 25.
      - dependency-name: "org.apereo.cas:cas-server-support-ldap-core"
        versions: [">= 7"]

  - package-ecosystem: "gradle"
    directories:
      - "/example"
      - "/firstdatapaymentgateway"
      - "/ldap"
      - "/lucene"
      - "/pricat"
      - "/rest-api"
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "java"
      - "release_branch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "example/vite-react-app"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "example/vite-react-app"
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "javascript"
      - "release_branch"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "projectmgr/webapp/projectmgr"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "projectmgr/webapp/projectmgr"
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "javascript"
      - "release_branch"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
