# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "gradle"
    directories:
      - "/ai-agent-skills"
      - "/aws-secrets-provider"
      - "/azure-keyvault-secrets-provider"
      - "/birt"
      - "/bitwarden-secrets-provider"
      - "/example"
      - "/firstdatapaymentgateway"
      - "/gcp-secretmanager-secrets-provider"
      - "/hashicorp-vault-secrets-provider"
      - "/ldap"
      - "/lucene"
      - "/onepassword-secrets-provider"
      - "/pricat"
    schedule:
      interval: "daily"
    #groups:
    #  all-dependencies:
    #    patterns:
    #      - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gradle"
    directories:
      - "/ai-agent-skills"
      - "/birt"
      - "/example"
      - "/firstdatapaymentgateway"
      - "/ldap"
      - "/lucene"
      - "/pricat"
      - "/rest-api"
    target-branch: "release24.09"
    schedule:
      interval: "daily"
    #groups:
    #  all-dependencies:
    #    patterns:
    #      - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "example/vite-react-app"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "example/vite-react-app"
    target-branch: "release24.09"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "projectmgr/webapp/projectmgr"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "projectmgr/webapp/projectmgr"
    target-branch: "release24.09"
    schedule:
      interval: "daily"
