// Optional -Photreload.components=compA,compB, forwarded as
// -Dofbiz.hotreload.components to DevReloadContainer, which then only watches those
// components' servicedef/source directories instead of every component in the checkout.
// See DevReloadContainer's `allowedComponents` javadoc for why: macOS's WatchService has
// a practical per-process ceiling on watched directories well under a typical ulimit,
// and a checkout the size of OFBiz trunk (~50+ components) can exceed it.
static List<String> hotreloadComponentArgs(Project project) {
    String components = project.findProperty('hotreload.components')
    return components ? ["-Dofbiz.hotreload.components=${components}".toString()] : []
}

// Optional -Photreload.watchBuildOutput=true, forwarded as
// -Dofbiz.hotreload.watchBuildOutput to DevReloadContainer. Off by default: watching
// build/classes/java/main only matters for picking up externally-produced .class files
// (e.g. `./gradlew -t classes` running in a second terminal) -- in-process compiles hot-swap
// directly and never need it -- and unlike source/servicedef watching, that tree isn't
// narrowed by -Photreload.components, so on a full checkout it roughly doubles the total
// directories watched for no benefit to the common (in-process-only) workflow.
static List<String> hotreloadWatchBuildOutputArgs(Project project) {
    Object watchBuildOutput = project.findProperty('hotreload.watchBuildOutput')
    return watchBuildOutput ? ["-Dofbiz.hotreload.watchBuildOutput=${watchBuildOutput}".toString()] : []
}

// Whether -Photreload.enhanced=true was passed. Checked by *value*, not just presence --
// project.hasProperty() alone would also be true for -Photreload.enhanced=false (or any
// other value), the opposite of the caller's intent, unlike the two functions above which
// correctly check the property's value via findProperty().
static boolean hotreloadEnhancedRequested(Project project) {
    return 'true'.equalsIgnoreCase(project.findProperty('hotreload.enhanced')?.toString())
}

// DevReloadContainer's own in-process-compile output directory. Deliberately separate
// from Gradle's own build/classes/java/main (see DevReloadContainer's hotReloadOutputDir
// field javadoc for why) and placed ahead of the normal runtime classpath below, so a
// class compiled here but never yet loaded in the running JVM picks up the live version
// on its first load too, not just already-loaded ones. Passed down to the JVM as a system
// property (see commonHotReloadJvmArgs) rather than hardcoded independently on the Java
// side too, so this path exists as a single source of truth.
static File hotReloadOutputDir(Project project) {
    return new File(project.rootDir, 'build/devreload/classes')
}

// JVM args shared by both the default and enhanced ofbizDev variants: the hot-reload
// activation flags, the output-directory location, and the optional component/watch
// scoping args. Only -XX:+AllowEnhancedClassRedefinition differs between the two, so
// callers add that themselves.
static List<String> commonHotReloadJvmArgs(Project project) {
    List<String> args = ['-Dofbiz.hotreload=true', '-Djdk.attach.allowAttachSelf=true',
            "-Dofbiz.hotreload.outputDir=${hotReloadOutputDir(project).absolutePath}".toString()]
    args += hotreloadComponentArgs(project)
    args += hotreloadWatchBuildOutputArgs(project)
    return args
}

// Locates a DCEVM-patched `java` executable: an explicit -PdcevmHome=... or DCEVM_HOME
// env var wins, otherwise this falls back to common per-OS locations for the JBR (JetBrains
// Runtime, which bundles DCEVM) that ships with a local IntelliJ IDEA install -- the most
// convenient prebuilt source of a DCEVM JVM, though any standalone DCEVM build works too via
// the explicit override.
def resolveDcevmJavaExecutable = {
    String override = project.findProperty('dcevmHome') ?: System.getenv('DCEVM_HOME')
    String userHome = System.getProperty('user.home')
    String programFiles = System.getenv('ProgramFiles')
    List<String> candidates = override ? [override] : [
            '/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home',
            '/Applications/IntelliJ IDEA CE.app/Contents/jbr/Contents/Home',
            "${userHome}/.local/share/JetBrains/Toolbox/apps/intellij-idea-ultimate/ch-0/jbr",
            "${userHome}/.local/share/JetBrains/Toolbox/apps/intellij-idea-community-edition/ch-0/jbr",
            programFiles ? "${programFiles}\\JetBrains\\IntelliJ IDEA\\jbr" : null,
    ].findAll { it != null }
    String exeName = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'java.exe' : 'java'
    for (String home : candidates) {
        File exe = new File(home, "bin/${exeName}")
        if (exe.exists()) {
            return exe.absolutePath
        }
    }
    return null
}

// Convenience task: `./gradlew ofbizDev` starts OFBiz with hot-reload enabled
// (-Dofbiz.hotreload=true), plus the JVM flag DevReloadContainer's self-attaching
// HotSwapAgent needs (-Djdk.attach.allowAttachSelf=true). Registered on the root
// project, mirroring the classpath/mainClass wiring of the built-in `ofbiz` command
// task, so this plugin needs no change to the root build.gradle to be usable.
//
// Plain invocation runs on a stock JDK and only hot-swaps method bodies and
// services.xml. Passing -Photreload.enhanced=true switches to a DCEVM-patched JVM with
// -XX:+AllowEnhancedClassRedefinition, which additionally hot-swaps structural changes
// (added/removed methods or fields, changed signatures) -- see README for the full
// comparison. No DevReloadContainer/HotSwapAgent code depends on which JVM is running
// underneath, so enabling this needs no change on that side; it only needs a capable
// JVM to run on.
//
// A single JavaExec task handles both modes: JavaExec's `executable` property can be
// pointed at any java binary, including a DCEVM-patched one, without conflict -- no
// toolchain is configured anywhere in this project for it to conflict with. This project
// used to register a separate plain-Exec task for enhanced mode instead, on the theory
// that `executable` and the toolchain-derived `javaLauncher` convention couldn't coexist;
// confirmed by testing that setting `executable` on a JavaExec task fails with "Toolchain
// from executable property does not match toolchain from javaLauncher property" ONLY when
// set from a task action (e.g. inside doFirst, once javaLauncher's convention has already
// been finalized for execution) -- setting it directly in the configuration block below,
// before that convention finalizes, works cleanly. Using one task for both modes also
// means the enhanced path now gets JavaExec's automatic classpath-argfile handling for
// very long classpaths (a real risk on Windows, given how many jars are on OFBiz's
// runtime classpath) and --debug-jvm wiring too, neither of which the previous separate
// Exec-based task had.
rootProject.tasks.register('ofbizDev', JavaExec) {
    dependsOn rootProject.tasks.named('classes')
    group = 'OFBiz Server Commands'
    description = 'Start OFBiz with hot-reload. Java source + services.xml changes reload without a restart. ' +
            'Optionally scope to specific components with -Photreload.components=compA,compB, or watch ' +
            'build/classes/java/main too (for externally-produced .class files) with ' +
            '-Photreload.watchBuildOutput=true. Pass -Photreload.enhanced=true to additionally hot-swap ' +
            'structural changes (new/removed methods or fields) via a DCEVM-patched JVM; set ' +
            '-PdcevmHome=/path/to/jvm if not auto-detected -- see README for the full comparison.'
    classpath = rootProject.files(hotReloadOutputDir(project)) + rootProject.sourceSets.main.runtimeClasspath
    mainClass = rootProject.application.mainClass
    List<String> jvmArgsList = rootProject.application.applicationDefaultJvmArgs + commonHotReloadJvmArgs(project)
    if (hotreloadEnhancedRequested(project)) {
        jvmArgsList = jvmArgsList + ['-XX:+AllowEnhancedClassRedefinition']
        String dcevmJava = resolveDcevmJavaExecutable()
        if (!dcevmJava) {
            throw new GradleException("Could not find a DCEVM-patched JVM. Set -PdcevmHome=/path/to/jvm " +
                    "(the folder containing bin/java) or the DCEVM_HOME env var. JetBrains Runtime, which " +
                    "bundles DCEVM, ships with IntelliJ IDEA under '<IDE install>/jbr' (or " +
                    "'.../Contents/jbr' on macOS) and is the easiest way to get one; standalone DCEVM " +
                    "builds work too.")
        }
        logger.lifecycle("ofbizDev: enhanced mode, using DCEVM-patched JVM at ${dcevmJava}")
        executable = dcevmJava
    }
    jvmArgs(jvmArgsList)
}
