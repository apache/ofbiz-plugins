// Convenience task: `./gradlew ofbizDev` starts OFBiz with hot-reload enabled
// (-Dofbiz.hotreload=true). Registered on the root project, mirroring the
// classpath/mainClass wiring of the built-in `ofbiz` command task, so this
// plugin needs no change to the root build.gradle to be usable.
rootProject.tasks.register('ofbizDev', JavaExec) {
    dependsOn rootProject.tasks.named('classes')
    group = 'OFBiz Server Commands'
    description = 'Start OFBiz with hot-reload. Java source + services.xml changes reload without a restart.'
    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass = rootProject.application.mainClass
    jvmArgs(rootProject.application.applicationDefaultJvmArgs + ['-Dofbiz.hotreload=true'])
}
